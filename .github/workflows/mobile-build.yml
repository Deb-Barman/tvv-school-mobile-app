name: Mobile app - test, then build Android APK

# 1. TEST job : analyses the code and runs every unit + widget test.
# 2. BUILD job: only if the tests pass, builds the Android APK (and publishes it).
#   * Every push to main that touches /mobile : test + build.
#   * Manually: Actions tab -> "Mobile app - test, then build Android APK" -> Run workflow.
#     (Emergency only: tick "Skip tests" to build the APK even if a test is failing.)
#
# SHARE LINK (same link forever, always the newest build):
#   https://github.com/<owner>/<repo>/releases/download/mobile-latest/TVV-School.apk   (direct APK download)
#   https://github.com/<owner>/<repo>/releases/tag/mobile-latest                       (page with button + QR code)
# The finished run's Summary page prints both links and a QR code. Anyone can open them WITHOUT a GitHub account
# only if the repo (or the public release repo, see docs/MOBILE_SETUP.md section 4b) is public.
#
# Setup + install help: docs/MOBILE_SETUP.md

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "What is new in this build (shown on the download page)"
        type: string
        default: ""
      skip_tests:
        description: "Emergency only: build the APK without running the tests"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"

concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # One place to change the Flutter version. The app was written and statically analysed against this exact release.
  FLUTTER_VERSION: "3.41.9"
  # Repository VARIABLES (Settings > Secrets and variables > Actions > Variables). Defaults are used when not set.
  APP_ID: ${{ vars.TVV_APP_ID || 'com.tvv.school' }}
  APP_NAME: ${{ vars.TVV_APP_NAME || 'TVV School' }}
  API_BASE_URL: ${{ vars.TVV_API_BASE_URL || 'https://tufanganj-vivekanand-vidyalaya.onrender.com/api' }}
  WEBSITE_URL: ${{ vars.TVV_WEBSITE_URL || 'https://tufanganj-vivekanand-vidyalaya.vercel.app' }}
  # Where the finished APK is published. Default: this repository. To keep the code private but the download public,
  # set the variable TVV_RELEASE_REPO (a PUBLIC repo, "owner/name") and the secret TVV_RELEASE_TOKEN (see docs).
  RELEASE_REPO: ${{ vars.TVV_RELEASE_REPO || github.repository }}
  DOWNLOAD_PAGE: https://github.com/${{ vars.TVV_RELEASE_REPO || github.repository }}/releases/tag/mobile-latest
  DOWNLOAD_APK: https://github.com/${{ vars.TVV_RELEASE_REPO || github.repository }}/releases/download/mobile-latest/TVV-School.apk

jobs:
  test:
    name: 1 - Analyse + test
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_tests) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      # A real compile / type error stops here. Style hints and warnings are shown in the log but do not stop the build.
      - name: Analyse the code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # Every test must pass, otherwise the APK is NOT built.
      - name: Unit + widget tests
        shell: bash
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee test-output.txt

      - name: Test summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "### Test results"
            echo '```'
            if [ -f test-output.txt ]; then tail -n 30 test-output.txt; else echo "Tests did not start."; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: test-output
          path: mobile/test-output.txt
          if-no-files-found: ignore
          retention-days: 14

  apk:
    name: 2 - Build APK
    needs: test
    # Runs after the tests passed - or when the tests were skipped on purpose (never after a failed test).
    if: ${{ !failure() && !cancelled() }}
    env:
      RELEASE_TOKEN: ${{ secrets.TVV_RELEASE_TOKEN }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # lets the job publish the APK on the "mobile-latest" release
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Keeps the SAME test-signing key between builds, so a new APK installs over the old one without uninstalling.
      # (GitHub drops a cache that is unused for 7 days; if that happens, uninstall the old app once, then install.)
      - name: Remember the test-signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: tvv-apk-debug-keystore-v1

      - name: Generate the android project files
        run: python3 tool/prepare_platforms.py --app-id "$APP_ID" --app-name "$APP_NAME"

      - run: flutter pub get

      - name: App icons from the school seal
        run: dart run flutter_launcher_icons

      # Optional: sign with your own key when these four secrets exist (see docs/MOBILE_SETUP.md). Otherwise a test key is used.
      - name: Release signing (only if the keystore secrets exist)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.jks
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=upload-keystore.jks"
            } > android/key.properties
            echo "Signing with your own key."
          else
            echo "No keystore secrets: the APK is signed with the test key (perfect for installing on your own phone)."
          fi

      - name: Work out version
        id: ver
        run: |
          NAME=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//; s/\+.*//')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.ver.outputs.name }}" --build-number="${{ steps.ver.outputs.number }}" \
            --dart-define=API_BASE_URL="$API_BASE_URL" --dart-define=WEBSITE_URL="$WEBSITE_URL" \
            --dart-define=UPDATE_REPO="$RELEASE_REPO" --dart-define=APP_BUILD="${{ steps.ver.outputs.number }}" \
            --dart-define=APP_DOWNLOAD_URL="$DOWNLOAD_PAGE"

      - name: Name the file + checksum
        id: pkg
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/TVV-School.apk"
          SIZE=$(du -h dist/TVV-School.apk | cut -f1)
          SHA=$(sha256sum dist/TVV-School.apk | cut -d' ' -f1)
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/dist/TVV-School.apk
          retention-days: 30

      - name: Write the release page text
        env:
          NOTES_INPUT: ${{ github.event.inputs.release_notes }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          NOTES="${NOTES_INPUT:-$COMMIT_MSG}"
          [ -z "$NOTES" ] && NOTES="Latest build."
          QR="https://api.qrserver.com/v1/create-qr-code/?size=240x240&margin=10&data=${DOWNLOAD_APK}"
          {
            echo "## TVV School app"
            echo
            echo "**Download for Android:** [TVV-School.apk](${DOWNLOAD_APK})"
            echo
            echo "[![Scan to download](${QR})](${DOWNLOAD_APK})"
            echo
            echo "Scan the code with a phone camera, or tap the link, then open the downloaded file to install."
            echo "If Android asks, allow *Install unknown apps* for your browser (one time). If it says the app cannot be installed over the old one, uninstall the old app first."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Version | ${{ steps.ver.outputs.name }} (build ${{ steps.ver.outputs.number }}) |"
            echo "| Size | ${{ steps.pkg.outputs.size }} |"
            echo "| SHA-256 | \`${{ steps.pkg.outputs.sha }}\` |"
            echo "| Built from | ${{ github.sha }} |"
            echo
            echo "### What is new"
            echo "$NOTES"
            echo
            echo "<!-- tvv-build:${{ steps.ver.outputs.number }} tvv-version:${{ steps.ver.outputs.name }} -->"
          } > release-body.md
          cat release-body.md

      # Publish where this workflow runs (default).
      - name: Publish the download page (this repository)
        if: ${{ vars.TVV_RELEASE_REPO == '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          name: "TVV School app - latest build"
          prerelease: false
          make_latest: "true"
          body_path: mobile/release-body.md
          files: mobile/dist/TVV-School.apk

      # Publish to a separate PUBLIC repository (keeps the source code private, the download public).
      - name: Publish the download page (public release repository)
        if: ${{ vars.TVV_RELEASE_REPO != '' && env.RELEASE_TOKEN != '' }}
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ vars.TVV_RELEASE_REPO }}
          token: ${{ secrets.TVV_RELEASE_TOKEN }}
          tag_name: mobile-latest
          name: "TVV School app - latest build"
          prerelease: false
          make_latest: "true"
          body_path: mobile/release-body.md
          files: mobile/dist/TVV-School.apk

      - name: Explain a missing token
        if: ${{ vars.TVV_RELEASE_REPO != '' && env.RELEASE_TOKEN == '' }}
        run: |
          echo "::error::TVV_RELEASE_REPO is set but the secret TVV_RELEASE_TOKEN is missing. See docs/MOBILE_SETUP.md section 4b."
          exit 1

      - name: Show the share link on the run page
        shell: bash
        run: |
          {
            echo "## Your app is ready"
            echo
            echo "**Share this link (always the newest build):**"
            echo
            echo "- Download page: ${DOWNLOAD_PAGE}"
            echo "- Direct APK: ${DOWNLOAD_APK}"
            echo
            echo "![QR code](https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=10&data=${DOWNLOAD_APK})"
            echo
            echo "Version ${{ steps.ver.outputs.name }} (build ${{ steps.ver.outputs.number }}) - ${{ steps.pkg.outputs.size }}"
            echo
            echo "_Anyone can open the link without an account only if the repository holding the release is public._"
          } >> "$GITHUB_STEP_SUMMARY"
