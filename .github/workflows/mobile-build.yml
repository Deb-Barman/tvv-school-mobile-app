name: Mobile app - build Android APK

# Builds ONLY the Android APK of the Flutter app in /mobile, in the cloud (no laptop needed).
#   * Every push to main that touches /mobile : builds the APK.
#   * Manually: Actions tab -> "Mobile app - build Android APK" -> Run workflow.
#
# WHERE TO DOWNLOAD (on your phone):
#   1. Releases page of this repo -> the release called "mobile-latest" -> tap TVV-School.apk   (easiest)
#   2. or the finished run's page -> Artifacts -> android-apk (a zip that contains the APK)
#
# Setup + install help: docs/MOBILE_SETUP.md

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"

concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # One place to change the Flutter version. The app was written and statically analysed against this exact release.
  FLUTTER_VERSION: "3.41.9"
  # Repository VARIABLES (Settings > Secrets and variables > Actions > Variables). Defaults are used when not set.
  APP_ID: ${{ vars.TVV_APP_ID || 'com.tvv.school' }}
  APP_NAME: ${{ vars.TVV_APP_NAME || 'TVV School' }}
  API_BASE_URL: ${{ vars.TVV_API_BASE_URL || 'https://tufanganj-vivekanand-vidyalaya.onrender.com/api' }}
  WEBSITE_URL: ${{ vars.TVV_WEBSITE_URL || 'https://tufanganj-vivekanand-vidyalaya.vercel.app' }}

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # lets the job publish the APK on the "mobile-latest" release
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Keeps the SAME test-signing key between builds, so a new APK installs over the old one without uninstalling.
      # (GitHub drops a cache that is unused for 7 days; if that happens, uninstall the old app once, then install.)
      - name: Remember the test-signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: tvv-apk-debug-keystore-v1

      - name: Generate the android project files
        run: python3 tool/prepare_platforms.py --app-id "$APP_ID" --app-name "$APP_NAME"

      - run: flutter pub get

      - name: App icons from the school seal
        run: dart run flutter_launcher_icons

      # Informational only: these never stop the APK from being built (a real compile error would stop the build anyway).
      - name: Analyse (informational)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true
      - name: Tests (informational)
        run: flutter test
        continue-on-error: true

      # Optional: sign with your own key when these four secrets exist (see docs/MOBILE_SETUP.md). Otherwise a test key is used.
      - name: Release signing (only if the keystore secrets exist)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.jks
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=upload-keystore.jks"
            } > android/key.properties
            echo "Signing with your own key."
          else
            echo "No keystore secrets: the APK is signed with the test key (perfect for installing on your own phone)."
          fi

      - name: Work out version
        id: ver
        run: |
          NAME=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//; s/\+.*//')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.ver.outputs.name }}" --build-number="${{ steps.ver.outputs.number }}" \
            --dart-define=API_BASE_URL="$API_BASE_URL" --dart-define=WEBSITE_URL="$WEBSITE_URL"

      - name: Name the file
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/TVV-School.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/dist/TVV-School.apk
          retention-days: 30

      # A permanent, phone-friendly download page: Releases -> mobile-latest. Each build replaces the file.
      - name: Publish on the "mobile-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          name: "TVV School app - latest build"
          prerelease: true
          make_latest: "false"
          body: |
            Latest Android build of the TVV School app.

            **Version:** ${{ steps.ver.outputs.name }} (build ${{ steps.ver.outputs.number }})
            **Commit:** ${{ github.sha }}

            Tap **TVV-School.apk** below on your phone to download, then open it to install.
            If Android says it cannot be installed over the old one, uninstall the old app first (you only lose the saved sign-in).
          files: mobile/dist/TVV-School.apk
