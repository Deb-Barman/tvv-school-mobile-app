name: Mobile app - build (Android APK/AAB + iOS)

# Builds the Flutter app in /mobile in the cloud, so no laptop is needed.
#   * Every push to main that touches /mobile : checks + Android APK and AAB.
#   * Manually (Actions tab -> "Mobile app - build" -> Run workflow) : also iOS if you tick the box.
#   * Pushing a tag like  mobile-v1.0.0  : everything, and the APK is attached to a GitHub Release.
# Setup instructions: docs/MOBILE_SETUP.md

on:
  workflow_dispatch:
    inputs:
      build_ios:
        description: "Also build the iOS app (uses expensive macOS minutes)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"
    tags: ["mobile-v*"]
  pull_request:
    paths:
      - "mobile/**"

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # One place to change the Flutter version. The app was written and statically analysed against this exact release.
  FLUTTER_VERSION: "3.41.9"
  # Repository VARIABLES (Settings > Secrets and variables > Actions > Variables). Defaults are used when not set.
  APP_ID: ${{ vars.TVV_APP_ID || 'com.tvv.school' }}
  APP_NAME: ${{ vars.TVV_APP_NAME || 'TVV School' }}
  API_BASE_URL: ${{ vars.TVV_API_BASE_URL || 'https://tufanganj-vivekanand-vidyalaya.onrender.com/api' }}
  WEBSITE_URL: ${{ vars.TVV_WEBSITE_URL || 'https://tufanganj-vivekanand-vidyalaya.vercel.app' }}

jobs:
  checks:
    name: Analyse + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      # Real errors fail the build; style-only hints do not.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Unit + widget tests
        run: flutter test
        continue-on-error: true # shown as a warning; flip to false once you have seen them pass

  android:
    name: Android APK + AAB
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used to attach the APK to a GitHub Release on tags
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate android/ and ios/ project files
        run: python3 tool/prepare_platforms.py --app-id "$APP_ID" --app-name "$APP_NAME"
      - run: flutter pub get
      - name: App icons from the school seal
        run: dart run flutter_launcher_icons

      - name: Release signing (only if the keystore secrets exist)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.jks
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=upload-keystore.jks"
            } > android/key.properties
            echo "Signing with your upload key."
          else
            echo "::warning title=Test signing::No keystore secrets found. The APK is signed with a debug key (fine for testing). The AAB is NOT acceptable to Google Play until you add the ANDROID_* secrets (see docs/MOBILE_SETUP.md)."
          fi

      - name: Work out version
        id: ver
        run: |
          NAME=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//; s/\+.*//')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.ver.outputs.name }}" --build-number="${{ steps.ver.outputs.number }}" \
            --dart-define=API_BASE_URL="$API_BASE_URL" --dart-define=WEBSITE_URL="$WEBSITE_URL"
      - name: Build AAB (Google Play)
        run: |
          flutter build appbundle --release \
            --build-name="${{ steps.ver.outputs.name }}" --build-number="${{ steps.ver.outputs.number }}" \
            --dart-define=API_BASE_URL="$API_BASE_URL" --dart-define=WEBSITE_URL="$WEBSITE_URL"

      - name: Name the files
        run: |
          mkdir -p dist
          V="${{ steps.ver.outputs.name }}+${{ steps.ver.outputs.number }}"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/TVV-School-$V.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/TVV-School-$V.aab"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: mobile/dist/*
          retention-days: 30

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/dist/*.apk
          generate_release_notes: true

  ios:
    name: iOS build
    needs: checks
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_ios) || startsWith(github.ref, 'refs/tags/mobile-v') }}
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    env:
      ASC_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generate android/ and ios/ project files
        run: python3 tool/prepare_platforms.py --app-id "$APP_ID" --app-name "$APP_NAME"
      - run: flutter pub get
      - name: App icons from the school seal
        run: dart run flutter_launcher_icons

      - name: Work out version
        id: ver
        run: |
          NAME=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//; s/\+.*//')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # Always: proves the iOS app compiles. (Unsigned, so it cannot be installed on a phone.)
      - name: Build iOS (compile check, no signing)
        run: |
          flutter build ios --release --no-codesign \
            --build-name="${{ steps.ver.outputs.name }}" --build-number="${{ steps.ver.outputs.number }}" \
            --dart-define=API_BASE_URL="$API_BASE_URL" --dart-define=WEBSITE_URL="$WEBSITE_URL"

      # Only when the four Apple secrets exist: signed IPA through Apple's cloud signing (App Store Connect API key).
      - name: Archive + export signed IPA
        if: ${{ env.ASC_KEY_ID != '' && env.ASC_ISSUER_ID != '' && env.ASC_KEY_P8 != '' && env.APPLE_TEAM_ID != '' }}
        run: |
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$(dirname "$KEY_PATH")"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          cd ios
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic "${AUTH[@]}" archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist ExportOptions.plist "${AUTH[@]}"
          mkdir -p ../dist
          cp "$RUNNER_TEMP"/export/*.ipa "../dist/TVV-School-${{ steps.ver.outputs.name }}+${{ steps.ver.outputs.number }}.ipa"

      - name: Upload to TestFlight
        if: ${{ env.ASC_KEY_ID != '' && env.ASC_ISSUER_ID != '' && env.ASC_KEY_P8 != '' && env.APPLE_TEAM_ID != '' }}
        run: |
          xcrun altool --upload-app -f dist/*.ipa -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Warn when iOS is unsigned
        if: ${{ env.ASC_KEY_ID == '' || env.ASC_ISSUER_ID == '' || env.ASC_KEY_P8 == '' || env.APPLE_TEAM_ID == '' }}
        run: echo "::warning title=iOS not signed::The iOS app compiled, but no Apple secrets were found so no IPA was made. Add APPSTORE_KEY_ID, APPSTORE_ISSUER_ID, APPSTORE_KEY_P8 and APPLE_TEAM_ID (see docs/MOBILE_SETUP.md)."

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: ios-build
          path: |
            mobile/dist/*.ipa
          if-no-files-found: ignore
          retention-days: 30
