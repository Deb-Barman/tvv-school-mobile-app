name: tvv_mobile
description: Tufanganj Vivekananda Vidyalaya (H.S.) - official school app for students, teachers and the Super Admin.
publish_to: "none"
version: 1.4.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Tokens are kept in the Android Keystore / iOS Keychain, never in plain preferences.
  flutter_secure_storage: ^9.2.2
  # Only the theme choice and the "last role" hint are stored here (no secrets).
  shared_preferences: ^2.3.2
  # Opens marksheets, downloads and social links in the browser / Drive app.
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/school_logo.png
    - assets/fonts/Inter-LICENSE.txt

  # Inter (SIL Open Font License, see assets/fonts/Inter-LICENSE.txt): a clean, very readable screen font bundled in the
  # app so it looks the same on every phone and needs no download. Bengali text falls back to the phone's own font.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#05101C"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
